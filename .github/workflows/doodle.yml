name: Daily Doodle Bot

on:
  schedule:
    # Runs at 17:00 UTC (10:00 AM PST) every day
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual button clicks for testing

jobs:
  run-doodle-bot:
    runs-on: ubuntu-latest
    
    # Grants the workflow permission to save logs and images back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/generative-ai node-fetch form-data

      - name: Run Doodle Script
        run: node doodle.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit and Push Doodle Artifacts
        run: |
          git config --global user.name "Doodle Bot"
          git config --global user.email "bot@github.com"
          
          # Tracks the history array, the current text log, and the actual generated JPEG file
          git add doodle_history.json current_doodle.txt current_doodle.jpg
          
          # Only commits if changes were made to prevent workflow empty errors
          git diff-index --quiet HEAD || (git commit -m "Update daily artist logs [skip ci]" && git push)
